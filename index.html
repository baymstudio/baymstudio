<title>BaymStudio Gaming | Çok Yakında</title>

<style>
:root{--bg:#070b14;--text:#f2f6ff;--muted:#8d98b3;--cyan:#22d3ff;--pink:#f038ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"],:root:not([data-theme="light"]){--bg:#070b14;--text:#f2f6ff;--muted:#8d98b3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070b14}}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font-family:Sora,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;overflow-x:hidden}
.glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(60% 45% at 30% 20%,rgba(34,211,255,.14),transparent 70%),radial-gradient(50% 40% at 75% 80%,rgba(240,56,255,.14),transparent 70%)}
main{position:relative;width:100%;max-width:900px}
.logo{width:100%;max-width:820px;height:auto;display:block;margin:0 auto;-webkit-mask-image:radial-gradient(ellipse at center,#000 55%,transparent 82%);mask-image:radial-gradient(ellipse at center,#000 55%,transparent 82%);animation:rise 1.2s ease-out both}
h1{font-family:Unbounded,sans-serif;font-weight:700;font-size:clamp(2rem,6vw,3.6rem);letter-spacing:.02em;margin-top:-2.5rem;background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.motto{font-family:Unbounded,sans-serif;font-weight:500;font-size:clamp(1rem,2.6vw,1.4rem);letter-spacing:.35em;margin-top:1.4rem}
p{color:var(--muted);margin-top:1.2rem;font-size:clamp(.9rem,2vw,1.05rem);max-width:46ch;margin-inline:auto;line-height:1.6}
.bar{width:min(320px,70%);height:4px;border-radius:4px;margin:2rem auto 0;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;width:35%;border-radius:4px;background:linear-gradient(90deg,var(--cyan),var(--pink));animation:slide 2.4s ease-in-out infinite}
footer{position:relative;margin-top:2.5rem;color:var(--muted);font-size:.8rem}
@keyframes rise{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
@media (prefers-reduced-motion:reduce){.logo,.bar i{animation:none}}
</style>
</head>
